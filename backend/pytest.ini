[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = apps

# --reuse-db mantem o banco de teste entre execucoes. A criacao leva alguns
# segundos por causa das 14 migracoes; reaproveitar deixa o ciclo de escrever
# e rodar teste rapido o bastante para valer a pena rodar sempre.
#
# Quando uma migracao nova entrar, rode uma vez com --create-db.
addopts = --reuse-db -q
